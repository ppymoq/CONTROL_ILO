<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 10px; max-width: 600px; margin: auto; color: #333; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #d9383a; text-align: center; margin: 0 0 15px 0; font-size: 18px; text-transform: uppercase; }
        .fech { background: #eef2f7; border: 1px solid #d0d7de; text-align: center; padding: 8px; font-weight: bold; border-radius: 4px; margin-bottom: 15px; font-size: 13px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .prod { color: white; text-align: center; padding: 5px; font-weight: bold; border-radius: 4px; margin-bottom: 10px; font-size: 13px; text-transform: uppercase; }
        .cam { margin-bottom: 8px; }
        label { display: block; font-size: 10px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input[readonly] { background: #e9f7ef; color: #196f3d; font-weight: bold; border-color: #a3e4d7; }
        input[readonly].ant { background: #f2f2f2; color: #666; border-color: #ccc; }
        .inf { margin-top: 15px; background: #e8f8f5; border: 1px solid #a3e4d7; padding: 12px; border-radius: 6px; color: #117a65; font-size: 13px; font-weight: 600; }
        .inf.rojo { background: #fadbd8; border-color: #f5b7b1; color: #922b21; }
        button { background: #d9383a; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-size: 15px; font-weight: bold; border-radius: 4px; margin-top: 15px; text-transform: uppercase; }
        button:hover { background: #bc2f31; }
        #btnRotar { background: #e67e22 !important; display: none; }
        #msg { margin-top: 10px; text-align: center; font-size: 12px; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>
<div class="box">
    <h2>Control Diario de Inventario</h2>
    <div id="fechaVisor" class="fech">Cargando fecha...</div>
    <form id="fVentas">
        <div class="cam"><label>BROASTERO:</label><input type="text" id="usu" value="GUSTAVO" required></div>
        <div class="grid">
            <div>
                <div class="prod" style="background:#d9383a;">Pollo</div>
                <div class="cam"><label>ANT:</label><input type="number" id="pQ" class="ant" readonly value="0"></div>
                <div class="cam"><label>ENTRÓ:</label><input type="number" id="pE" placeholder="0"></div>
                <div class="cam"><label>TOTAL:</label><input type="number" id="pT" readonly value="0"></div>
                <div class="cam"><label>QUEDA:</label><input type="number" id="pK" placeholder="0"></div>
                <div class="cam"><label>VENTA:</label><input type="number" id="pV" readonly value="0"></div>
            </div>
            <div>
                <div class="prod" style="background:#f39c12;">Alitas</div>
                <div class="cam"><label>ANT:</label><input type="number" id="aQ" class="ant" readonly value="0"></div>
                <div class="cam"><label>ENTRÓ:</label><input type="number" id="aE" placeholder="0"></div>
                <div class="cam"><label>TOTAL:</label><input type="number" id="aT" readonly value="0"></div>
                <div class="cam"><label>QUEDA:</label><input type="number" id="aK" placeholder="0"></div>
                <div class="cam"><label>VENTA:</label><input type="number" id="aV" readonly value="0"></div>
            </div>
        </div>
        <div id="card" class="inf">
            <div id="st" style="text-align:center;margin-bottom:5px;font-size:14px;">✅ REGISTRO OK</div>
            • Piezas hoy: <span id="tH">0</span><br>
            • Acumulado Lote Aceite: <span id="tL">0</span> / 600<br>
            • Quedan aprox: <span id="tR">600</span><br>
            <small style="display:block;margin-top:4px;font-weight:normal;opacity:0.8;">Estado: <span id="uC">-</span></small>
        </div>
        <button type="button" id="btnRotar">🔄 REGISTRAR CAMBIO DE ACEITE</button>
        <button type="submit">Procesar Registro Diario</button>
    </form>
    <div id="msg">Cargando saldos de Google Sheets...</div>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbyw-a5cGJC1HaSMxLZ11tAVDxFnh9LN1V0sowql12hDqb11ORA6Llpb6SKzdnnu3oN09g/exec";
    // Le agregamos el parámetro ?local=ilo para que al cargar lea las pestañas de Ilo
    const URL = URL_BASE + "?local=ilo";
    let baseLote = 0;
    const n = el => (!el || el.value.trim() === "") ? 0 : (parseFloat(el.value)||0);

    function mostrarFechaActual() {
        const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        const ahora = new Date();
        document.getElementById('fechaVisor').textContent = "📅 " + dias[ahora.getDay()] + " " + String(ahora.getDate()).padStart(2,'0') + "/" + String(ahora.getMonth()+1).padStart(2,'0') + "/" + ahora.getFullYear();
    }

    window.addEventListener('DOMContentLoaded', () => {
        mostrarFechaActual();
        fetch(URL).then(r => r.json()).then(d => {
            document.getElementById('pQ').value = d.pollo_anterior !== undefined ? d.pollo_anterior : 0; 
            document.getElementById('aQ').value = d.alitas_anterior !== undefined ? d.alitas_anterior : 0;
            baseLote = parseFloat(d.acumulado_historico) || 0;
            document.getElementById('uC').textContent = d.ultimo_cambio_aceite || "Lote 1";
            document.getElementById('msg').style.color = "green"; 
            document.getElementById('msg').textContent = "Saldos cargados con éxito.";
            calc();
        }).catch(e => { document.getElementById('msg').textContent = "Listo para registrar."; calc(); });
    });

    function calc() {
        const pQ = document.getElementById('pQ'), pE = document.getElementById('pE'), pT = document.getElementById('pT'), pK = document.getElementById('pK'), pV = document.getElementById('pV');
        const aQ = document.getElementById('aQ'), aE = document.getElementById('aE'), aT = document.getElementById('aT'), aK = document.getElementById('aK'), aV = document.getElementById('aV');

        pT.value = n(pQ) + n(pE); pV.value = Math.max(0, n(pT) - n(pK));
        aT.value = n(aQ) + n(aE); aV.value = Math.max(0, n(aT) - n(aK));

        const hoy = n(pV) + (n(aV) / 3);
        const tot = baseLote + hoy;
        const res = Math.max(0, 600 - tot);

        document.getElementById('tH').textContent = hoy.toFixed(1);
        document.getElementById('tL').textContent = tot.toFixed(1);
        document.getElementById('tR').textContent = res.toFixed(1);

        if (tot >= 600) {
            document.getElementById('card').className = 'inf rojo';
            document.getElementById('st').textContent = "⚠️ ROTAR LOTE (CAMBIAR ACEITE)";
            document.getElementById('btnRotar').style.display = 'block';
        } else {
            document.getElementById('card').className = 'inf';
            document.getElementById('st').textContent = "✅ REGISTRO OK";
            document.getElementById('btnRotar').style.display = 'none';
        }
    }

    ['pE','pK','aE','aK'].forEach(id => document.getElementById(id).addEventListener('input', calc));

    document.getElementById('btnRotar').addEventListener('click', () => {
        if(!confirm("¿Confirmas el cambio físico de aceite?")) return;
        document.getElementById('msg').textContent = "Guardando rotación...";
        fetch(URL, {
            method: 'POST', mode: 'cors', headers: {'Content-Type':'text/plain'},
            body: JSON.stringify({ accion: "ROTAR_ACEITE", usuario: document.getElementById('usu').value, piezas_finales: baseLote })
        }).then(() => {
            document.getElementById('msg').textContent = "¡Lote cerrado con éxito!";
            setTimeout(() => location.reload(), 1000);
        }).catch(() => setTimeout(() => location.reload(), 1200));
    });

   
    document.getElementById('fVentas').addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('msg').textContent = "Guardando reporte diario (ILO)...";
        fetch(URL, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                local: "ilo", // 👈 Esto le dice a Google que guarde en la pestaña de ILO
                usuario: document.getElementById('usu').value, 
                pollo_quedo: n(pQ), pollo_entro: n(pE), pollo_total: n(pT), pollo_venta: n(pV), pollo_queda: n(pK),
                alitas_quedo: n(aQ), alitas_entro: n(aE), alitas_total: n(aT), alitas_venta: n(aV), alitas_queda: n(aK)
            })
        }).then(() => {
            document.getElementById('msg').textContent = "¡Guardado con éxito!";
            setTimeout(() => location.reload(), 1200);
        }).catch(() => { document.getElementById('msg').textContent = "Error al guardar."; });
    });
</script>
</body>
</html>
